<div class="log-view"><header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <strong>日志</strong></div><div class="topbar-right"><button class="secondary" onclick="logout()">退出登录</button></div></header><section class="hero page-header"><div class="page-heading"><h1 id="log-title">日志</h1><p class="muted">选择应用，切换服务，查看运行记录。</p></div></section><div class="logs-controls"><label class="log-app-label" for="log-app">应用 <select id="log-app" aria-label="选择日志应用" onchange="selectLogApp(this.value)"><option>加载中…</option></select></label><div class="log-toolbar"><label><input id="log-auto" type="checkbox">每 10 秒刷新</label><button id="log-refresh" class="secondary" onclick="refreshLogs()">刷新</button></div></div><div id="log-tabs" class="log-tabs" role="tablist" aria-label="日志来源"></div><p id="log-status" class="log-status" role="status">正在读取日志…</p><pre id="log-output" class="log-output" role="tabpanel" tabindex="0" aria-label="日志内容">加载中…</pre></div>
