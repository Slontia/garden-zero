<!--NAVIGATION-->
<header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <strong>备份</strong></div><div class="topbar-right"><span id="connection-badge" class="connection-badge">正在连接…</span><button class="secondary" onclick="logout()">退出登录</button></div></header>
<section class="hero page-header"><div class="page-heading"><h1>备份</h1><p class="muted">管理网盘与查看备份记录。</p></div></section>
<p id="message" role="status" aria-live="polite"></p><section id="storage-alert" class="card" role="alert" hidden><h2>存储保护已开启</h2><p>请先完成存储校验，再发起备份。</p></section>
<div id="backups-page" class="backup-layout">
<section class="card cloud-backup-card" aria-labelledby="cloud-backup-heading">
 <div class="card-heading"><h2 id="cloud-backup-heading">网盘备份 <span class="backup-help" data-help="在线读取原始文件并增量上传，不生成全量本地副本、不停写应用。数据库单独在线导出，不保证数据库与附件属于同一时刻；云端保留历史版本。"></span></h2><div class="actions"><button id="cloud-add" disabled data-control class="secondary" onclick="openCloudAccount()">添加阿里云盘</button></div></div>
 <div id="backup-operation-row" class="backup-operation-row" hidden><p id="backup-operation-status" role="status" aria-live="polite"></p></div>
  <p id="cloud-state" class="file-empty"></p><div id="cloud-accounts"></div>
</section>
<section class="card backup-records-card" aria-labelledby="backup-records-heading">
 <div class="card-heading"><h2 id="backup-records-heading">备份记录 <span class="backup-help" data-help="仅展示脚本执行的磁盘备份记录，历史记录在本机保留，不依赖备份磁盘在线。早期记录仅展示已有证据，详细错误和磁盘标识可展开查看。"></span></h2><span id="history-count" class="muted"></span></div>
 <div class="backup-filters"><label>结果<select id="history-state" onchange="filterBackupHistory()"><option value="">全部结果</option><option value="success">成功</option><option value="interrupted">中断</option><option value="failed">失败</option><option value="running">进行中</option></select></label><label>目标<select id="history-target" onchange="filterBackupHistory()"><option value="">全部目标</option></select></label></div>
 <div class="backup-table-scroll"><table class="backup-history"><thead><tr><th>时间</th><th>目标</th><th>结果</th><th>详情</th></tr></thead><tbody id="backup-history"></tbody></table></div>
 <p id="history-empty" class="file-empty" hidden>没有符合条件的备份记录</p>
 <div class="backup-pagination"><button id="history-prev" class="secondary" onclick="changeHistoryPage(-1)">上一页</button><span id="history-page" class="muted"></span><button id="history-next" class="secondary" onclick="changeHistoryPage(1)">下一页</button></div>
</section>
</div>
<footer class="page-footer"><span>GARDEN ZERO</span><span>状态自动更新</span></footer>
<dialog id="cloud-dialog" aria-labelledby="cloud-dialog-title"><h2 id="cloud-dialog-title">连接阿里云盘</h2><p>使用阿里云盘 App 扫码确认。 <span class="backup-help" data-help="OpenList 授权服务参与令牌签发与续期，令牌仅保存在 NAS；备份使用云盘中的 GardenZero-Backup 目录。"></span></p><div id="cloud-form" hidden><input id="cloud-name" type="hidden" value="我的阿里云盘"><button id="cloud-authorize" onclick="startCloudAuthorization()">重新生成二维码</button></div><div id="cloud-qr-panel" hidden><img id="cloud-qr" alt="使用阿里云盘 App 扫码授权" width="240" height="240"><p>请使用阿里云盘 App 扫码并确认授权。</p></div><p id="cloud-dialog-status" role="status" aria-live="polite"></p><button class="secondary" onclick="closeCloudAccount()">关闭</button></dialog>

<dialog id="cloud-delete-dialog" aria-labelledby="cloud-delete-title"><h2 id="cloud-delete-title">删除云盘账号？</h2><p id="cloud-delete-name"></p><p class="muted">将解除庭院与此账号的连接并停止自动备份。云盘内已有的备份文件和 NAS 保存的恢复密码会保留。</p><p id="cloud-delete-error" role="status"></p><div class="actions"><button id="cloud-delete-confirm" class="danger" onclick="confirmCloudDelete()">确认删除</button><button class="secondary" onclick="cancelCloudDelete()">取消</button></div></dialog>
